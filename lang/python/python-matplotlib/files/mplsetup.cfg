[libs]
# Link against the freetype and qhull of this tree instead of downloading and
# building the bundled copies (build hosts behind the CN firewall cannot fetch
# them).
system_freetype = True
system_qhull = True
enable_lto = False

[packages]
# Do not ship the ~10 MB of baseline images used by the upstream test suite.
tests = False

[rc_options]
backend = Agg
